<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Клиент - Мои заказы</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        .btn { display: inline-block; padding: 10px 20px; background-color: #4CAF50; color: white; text-decoration: none; border-radius: 5px; margin-bottom: 20px; }
        .btn:hover { background-color: #45a049; }
    </style>
</head>
<body>
    <h1>Мои заказы</h1>
    <p>Клиент: <strong th:text="${username}"></strong></p>
    
    <a th:href="@{/client/order/new}" class="btn">Создать новый заказ</a>
    
    <div th:if="${not #lists.isEmpty(orders)}">
        <table>
            <tr>
                <th>ID</th>
                <th>Марка</th>
                <th>Номер</th>
                <th>Описание</th>
                <th>Статус</th>
                <th>Дата создания</th>
            </tr>
            <tr th:each="order : ${orders}">
                <td th:text="${order.id}">1</td>
                <td th:text="${order.carBrand}">Toyota</td>
                <td th:text="${order.carNumber}">A123BC</td>
                <td th:text="${order.description}">Не заводится</td>
                <td th:text="${order.status}">NEW</td>
                <td th:text="${#temporals.format(order.createdAt, 'dd.MM.yyyy HH:mm')}">01.01.2025 10:00</td>
            </tr>
        </table>
    </div>
    <div th:if="${#lists.isEmpty(orders)}">
        <p>У вас пока нет заказов.</p>
    </div>
    
    <form action="/logout" method="post" style="margin-top: 20px;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit">Выйти</button>
    </form>
</body>
</html>
