<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Мастер - Все заказы</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #2196F3; color: white; }
        select { padding: 5px; }
        .btn-small { padding: 5px 10px; background-color: #2196F3; color: white; border: none; cursor: pointer; }
        .btn-small:hover { background-color: #0b7dda; }
        .status-new { background-color: #fff3cd; }
        .status-in-progress { background-color: #d1ecf1; }
        .status-completed { background-color: #d4edda; }
        .status-cancelled { background-color: #f8d7da; }
    </style>
</head>
<body>
    <h1>Все заказы</h1>
    <p>Мастер: <strong th:text="${username}"></strong></p>
    
    <div th:if="${not #lists.isEmpty(orders)}">
        <table>
            <tr>
                <th>ID</th>
                <th>Клиент</th>
                <th>Марка</th>
                <th>Номер</th>
                <th>Описание</th>
                <th>Статус</th>
                <th>Дата создания</th>
                <th>Действие</th>
            </tr>
            <tr th:each="order : ${orders}" th:class="'status-' + ${order.status.toLowerCase()}">
                <td th:text="${order.id}">1</td>
                <td th:text="${order.client.fullName}">Иванов И.И.</td>
                <td th:text="${order.carBrand}">Toyota</td>
                <td th:text="${order.carNumber}">A123BC</td>
                <td th:text="${order.description}">Не заводится</td>
                <td th:text="${order.status}">NEW</td>
                <td th:text="${#temporals.format(order.createdAt, 'dd.MM.yyyy HH:mm')}">01.01.2025 10:00</td>
                <td>
                    <form th:action="@{/master/order/{id}/status(id=${order.id})}" method="post" style="display:inline;">
                        <select name="status">
                            <option value="NEW" th:selected="${order.status == 'NEW'}">Новый</option>
                            <option value="IN_PROGRESS" th:selected="${order.status == 'IN_PROGRESS'}">В работе</option>
                            <option value="COMPLETED" th:selected="${order.status == 'COMPLETED'}">Выполнен</option>
                            <option value="CANCELLED" th:selected="${order.status == 'CANCELLED'}">Отменён</option>
                        </select>
                        <button type="submit" class="btn-small">Изменить</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>
    <div th:if="${#lists.isEmpty(orders)}">
        <p>Заказов нет.</p>
    </div>
    
    <form action="/logout" method="post" style="margin-top: 20px;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit">Выйти</button>
    </form>
</body>
</html>
