<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Создание заказа</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 5px; background-color: #f9f9f9; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, button { width: 100%; padding: 8px; box-sizing: border-box; }
        textarea { height: 150px; resize: vertical; }
        button { background-color: #4CAF50; color: white; border: none; padding: 10px; cursor: pointer; }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Создание нового заказа</h1>
        <form th:action="@{/client/order}" method="post" th:object="${order}">
            <div class="form-group">
                <label for="carBrand">Марка автомобиля:</label>
                <input type="text" id="carBrand" th:field="*{carBrand}" required>
            </div>
            <div class="form-group">
                <label for="carNumber">Госномер:</label>
                <input type="text" id="carNumber" th:field="*{carNumber}" required>
            </div>
            <div class="form-group">
                <label for="description">Описание поломки:</label>
                <textarea id="description" th:field="*{description}" required></textarea>
            </div>
            <div class="form-group">
                <button type="submit">Отправить заказ</button>
            </div>
        </form>
        <a th:href="@{/client/home}" style="display: block; text-align: center; margin-top: 10px;">Вернуться назад</a>
    </div>
</body>
</html>
